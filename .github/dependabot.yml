version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: direct
    versioning-strategy: increase
    labels:
      - dependabot
      - dependencies
    commit-message:
      prefix: dependencies
      prefix-development: devDependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    labels:
      - dependabot
      - docker
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    labels:
      - dependabot
      - ci
    commit-message:
      prefix: ci
