name: CI

on:
  push:
  # Builds and tests with the current Alpine packages
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run prettier

      - name: commitlint
        run: npm run commitlint

      - name: ShellCheck
        run: shellcheck -x bin/tor-migrate test/*.sh

      - name: build
        run: docker build -t test:latest .

      - name: test the image
        run: test/image.sh test:latest

      - name: test the migration from v1
        run: test/migration.sh test:latest

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      # https://github.com/marketplace/actions/docker-setup-qemu
      - uses: docker/setup-qemu-action@v4
      # https://github.com/marketplace/actions/docker-setup-buildx
      - uses: docker/setup-buildx-action@v4

      - name: Build for every published platform
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/ppc64le
          push: false

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    needs: [test, build]

    runs-on: ubuntu-latest

    # semantic-release pushes the release commit and tag with the token that
    # actions/checkout keeps in the git config, creates the GitHub release and
    # comments on the released issues and pull requests
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Import GPG key
        run: echo "$GPG_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}

      # Git calls this as its gpg program; the passphrase goes through a file
      # descriptor instead of the command line
      - name: Add the custom gpg executable
        run: |
          cat > /tmp/gpg.sh <<'EOF'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode=loopback --passphrase-fd 3 "$@" 3<<< "$GPG_KEY_PASSPHRASE"
          EOF
          chmod +x /tmp/gpg.sh

      - name: Setup git
        run: |
          git config commit.gpgsign true
          git config user.signingkey "$GPG_KEY_ID"
          git config gpg.program /tmp/gpg.sh
        env:
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY_PASSPHRASE: ${{ secrets.GPG_KEY_PASSPHRASE }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}

      # The release commit is tagged when a new version was released. The tag
      # may already be pushed when a later step of semantic-release fails (as
      # the push of its notes for 2.0.0), so publish it anyway
      - name: Get the released tag
        id: tag
        if: ${{ !cancelled() }}
        run: |
          tag=$(git tag --points-at HEAD 'v*')
          if [ -n "$tag" ] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  # A release created with GITHUB_TOKEN does not trigger other workflows, so
  # publish the image from here
  publish:
    needs: [release]

    if: ${{ !cancelled() && needs.release.outputs.tag != '' }}

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
